<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetSpectre Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow { box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
    </style>
</head>
<body class="min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-12 border-b border-slate-700 pb-4">
            <h1 class="text-4xl font-light tracking-widest text-sky-400">NET<span class="font-bold">SPECTRE</span></h1>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Control Panel -->
            <div class="glass p-6 rounded-2xl md:col-span-1 h-fit">
                <h2 class="text-xl font-semibold mb-4">Scanner Configuration</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Target Range (CIDR/IP)</label>
                        <input type="text" id="target" value="192.168.1.0/24" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 focus:outline-none focus:border-sky-500 text-white placeholder-slate-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Scan Profile</label>
                        <select id="mode" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-white">
                            <option value="light">Light Scan (Fast SYN + ARP)</option>
                            <option value="deep">Deep Scan (-sV -O Full Ports)</option>
                        </select>
                    </div>
                    <button onclick="startScan()" id="scanBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold py-3 px-4 rounded-lg transition-all glow">
                        INITIALIZE SCAN
                    </button>
                    <div id="statusIndicator" class="mt-4 text-center text-sm font-mono text-sky-400 animate-pulse hidden">
                        SCAN IN PROGRESS...
                    </div>
                </div>
            </div>

            <!-- Terminal output -->
            <div class="glass p-6 rounded-2xl md:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">Live Logs & Alerts</h2>
                    <div id="progressText" class="text-sm font-mono text-slate-400">WAITING...</div>
                </div>
                <div id="terminal" class="bg-black/50 border border-slate-700 rounded-lg p-4 font-mono text-sm h-64 overflow-y-auto space-y-2 text-green-400">
                    <div>> System initialized. Ready to scan.</div>
                </div>

                <!-- Results Actions -->
                <div id="actions" class="mt-6 flex space-x-4 hidden">
                    <a id="btnPdf" href="#" target="_blank" class="flex-1 bg-slate-700 hover:bg-slate-600 border border-slate-500 text-center py-2 rounded-lg transition">📄 Download PDF</a>
                    <a id="btnHtml" href="#" target="_blank" class="flex-1 bg-indigo-600 hover:bg-indigo-500 border border-indigo-400 text-center py-2 rounded-lg transition glow">✨ View Interactive HTML</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple polling for Celery Task updates (WebSocket is an alternative)
        let currentTaskId = null;
        let pollInterval = null;

        function logToTerminal(msg, color='text-green-400') {
            const term = document.getElementById('terminal');
            term.innerHTML += `<div class="${color}">> ${msg}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        async function startScan() {
            const target = document.getElementById('target').value;
            const mode = document.getElementById('mode').value;
            
            document.getElementById('scanBtn').disabled = true;
            document.getElementById('statusIndicator').classList.remove('hidden');
            document.getElementById('actions').classList.add('hidden');
            document.getElementById('terminal').innerHTML = ''; // reset

            logToTerminal(`Initiating ${mode.toUpperCase()} scan on ${target}...`, 'text-sky-400');

            try {
                const res = await fetch('/api/scan/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({target, mode})
                });
                const data = await res.json();
                if(data.task_id) {
                    currentTaskId = data.task_id;
                    logToTerminal(`Task dispatched. Task ID: ${currentTaskId}`);
                    pollInterval = setInterval(pollStatus, 2000);
                }
            } catch (e) {
                logToTerminal(`Error starting scan: ${e}`, 'text-red-400');
            }
        }

        async function pollStatus() {
            if(!currentTaskId) return;
            const res = await fetch(`/api/scan/${currentTaskId}/status`);
            const data = await res.json();
            
            document.getElementById('progressText').innerText = data.state;

            if(data.status) {
                logToTerminal(data.status);
            }

            if(data.state === 'SUCCESS') {
                clearInterval(pollInterval);
                document.getElementById('scanBtn').disabled = false;
                document.getElementById('statusIndicator').classList.add('hidden');
                
                logToTerminal("Scan complete. Reports generated.", "text-green-300");
                
                document.getElementById('actions').classList.remove('hidden');
                document.getElementById('btnPdf').href = `/api/scan/report/${data.result.pdf_report}`;
                document.getElementById('btnHtml').href = `/api/scan/report/${data.result.html_report}`;
            } else if (data.state === 'FAILURE') {
                clearInterval(pollInterval);
                document.getElementById('scanBtn').disabled = false;
                document.getElementById('statusIndicator').classList.add('hidden');
                logToTerminal("Task failed critically.", "text-red-500");
            }
        }
    </script>
</body>
</html>
